name: arno-backend

services:
  db:
    image: postgres:18-alpine
    container_name: arno-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arno-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-arno-finance}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - arno_backend_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arno-finance} -d ${POSTGRES_DB:-arno-finance}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arno_backend_pg:
