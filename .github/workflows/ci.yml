name: arno-backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  pipeline:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arno
          POSTGRES_PASSWORD: arno
          POSTGRES_DB: tesouraria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arno -d tesouraria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yarn 1
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Dependências
        run: yarn install --frozen-lockfile

      - name: Testes
        run: yarn test:all
        env:
          DATABASE_URL: postgres://arno:arno@127.0.0.1:5432/tesouraria
          AUTH_SECRET: ci-secret

      - name: Imagem
        run: docker build -t arno-backend:${{ github.sha }} .

      - name: Publicar container
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: bash deploy/ship.sh arno-backend arno-backend:${{ github.sha }} 4000 4000 /home/arno-backend/.env /api/health
